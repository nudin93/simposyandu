name: build-full-zip
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, intl, mbstring, json
          tools: composer
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - run: |
          rm -f simposyandu-ci4-full.zip
          zip -r simposyandu-ci4-full.zip app public writable database composer.json composer.lock spark preload.php env -x 'writable/cache/*' 'writable/logs/*' 'writable/session/*' 'writable/debugbar/*' > /dev/null
          zip -r simposyandu-ci4-full.zip vendor -x 'vendor/*/.git*' > /dev/null
          ls -lh simposyandu-ci4-full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simposyandu-ci4-full
          path: simposyandu-ci4-full.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: simposyandu-ci4-full.zip
